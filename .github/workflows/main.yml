name: Build, Push & Deploy

on:
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    outputs:
      name: ${{ steps.pkg.outputs.name }}
      version: ${{ steps.pkg.outputs.version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get version from package.json
        id: pkg
        run: |
          echo "version=$(node -p 'require("./package.json").version')" >> $GITHUB_OUTPUT
          echo "name=$(node -p 'require("./package.json").name')" >> $GITHUB_OUTPUT

      - name: Login to Huawei SWR
        run: |
          docker login -u ap-southeast-2@HPUAGIPPWFA7YCNYJIGE \
            -p ${{ secrets.HUAWEI_REGISTRY_PASSWORD }} \
            swr.ap-southeast-2.myhuaweicloud.com

      - name: Build Docker image
        run: |
          docker build --no-cache --platform linux/amd64 \
            -t swr.ap-southeast-2.myhuaweicloud.com/osd-internal/${{ steps.pkg.outputs.name }}:v${{ steps.pkg.outputs.version }} \
            -f Dockerfile .

      - name: Push Docker image
        run: |
          docker push swr.ap-southeast-2.myhuaweicloud.com/osd-internal/${{ steps.pkg.outputs.name }}:v${{ steps.pkg.outputs.version }}

  deploy:
    runs-on: self-hosted
    needs: build-and-push

    steps:
      - name: Deploy
        run: |
          echo success
          docker pull swr.ap-southeast-2.myhuaweicloud.com/osd-internal/${{ needs.build-and-push.outputs.name }}:v${{ needs.build-and-push.outputs.version }}
          # docker stop ${{ needs.build-and-push.outputs.name }} || true
          # docker rm ${{ needs.build-and-push.outputs.name }} || true
          # docker run -d --restart=always -p 8800:80 --name ${{ needs.build-and-push.outputs.name }} \
          #   swr.ap-southeast-2.myhuaweicloud.com/osd-internal/${{ needs.build-and-push.outputs.name }}:v${{ needs.build-and-push.outputs.version }}
          # DEPLOY
