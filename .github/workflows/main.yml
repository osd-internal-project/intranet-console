name: Deploy Next.js Project Intranet to On-Prem Server

on:
  push:
    branches:
      - main # Adjust this to match your deployment branch

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest 

    steps:
        - name: Checkout repository
          uses: actions/checkout@v4
          
        - name: Fix Docker permissions
          run: |
            echo "${{ secrets.SERVER_PASSWORD }}" | sudo -S chmod 666 /var/run/docker.sock
            
        - name: Set up Docker Buildx
          uses: docker/setup-buildx-action@v3
  
        - name: Log in to Docker Hub (if using Docker Hub)
          uses: docker/login-action@v2
          with:
            username: ${{ secrets.DOCKER_USERNAME }}
            password: ${{ secrets.DOCKER_PASSWORD }}
  
        - name: Build and push Docker image
          run: |
            docker build --platform linux/amd64 -t osd-intranet-fe:v1.1.1 .
            docker tag osd-intranet-fe:v1.1.1 ${{ secrets.DOCKER_USERNAME }}/osd-intranet-fe:v1.1.1
            docker push ${{ secrets.DOCKER_USERNAME }}/osd-intranet-fe:v1.1.1

        - name: Deploy on Server
          run: |
            docker pull ${{ secrets.DOCKER_USERNAME }}/osd-intranet-fe:v1.1.1
            docker stop osd-intranet-fe || true
            docker rm osd-intranet-fe || true
            docker run -d --restart=always -p 8800:80 --name osd-intranet-fe ${{ secrets.DOCKER_USERNAME }}/osd-intranet-fe:v1.1.1
