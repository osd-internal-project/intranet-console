name: Build, Push & Deploy

on:
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get version from package.json
        id: pkg
        run: |
          echo "version=$(node -p 'require("./package.json").version')" >> $GITHUB_OUTPUT
          echo "name=$(node -p 'require("./package.json").name')" >> $GITHUB_OUTPUT

      - name: Login to Huawei SWR
        run: |
          docker login -u ap-southeast-2@HPUAGIPPWFA7YCNYJIGE \
            -p ${{ secrets.HUAWEI_REGISTRY_PASSWORD }} \
            swr.ap-southeast-2.myhuaweicloud.com

      - name: Build Docker image
        run: |
          docker build --no-cache --platform linux/amd64 \
            -t swr.ap-southeast-2.myhuaweicloud.com/osd-internal/${{ steps.pkg.outputs.name }}:v${{ steps.pkg.outputs.version }} \
            -f Dockerfile .

      - name: Push Docker image
        run: |
          docker push swr.ap-southeast-2.myhuaweicloud.com/osd-internal/${{ steps.pkg.outputs.name }}:v${{ steps.pkg.outputs.version }}

      - name: Deploy via jump host
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            sshpass -p '${{ secrets.SSH_TARGET_PASSWORD }}' ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_TARGET_USERNAME }}@${{ secrets.SSH_TARGET_HOST }} << 'DEPLOY'
            docker login -u ap-southeast-2@HPUAGIPPWFA7YCNYJIGE \
              -p ${{ secrets.HUAWEI_REGISTRY_PASSWORD }} \
              swr.ap-southeast-2.myhuaweicloud.com
            docker pull swr.ap-southeast-2.myhuaweicloud.com/osd-internal/${{ steps.pkg.outputs.name }}:v${{ steps.pkg.outputs.version }}
            docker stop ${{ steps.pkg.outputs.name }} || true
            docker rm ${{ steps.pkg.outputs.name }} || true
            docker run -d --restart=always -p 8831:80 --name ${{ steps.pkg.outputs.name }} \
              swr.ap-southeast-2.myhuaweicloud.com/osd-internal/${{ steps.pkg.outputs.name }}:v${{ steps.pkg.outputs.version }}
            DEPLOY
